name: assalkom
publish_to: none
description: "عسلكم — Souq Al Assal / سوق العسل"
version: 0.1.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.0.10+1
  assalkom_contracts:
    path: ../../packages/contracts_dart
  assalkom_data:
    path: ../../packages/data_dart
  assalkom_design:
    path: ../../packages/design_system/dart
  supabase_flutter: ^2.17.2
  image_picker: ^1.1.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - assets/demo_catalog.json
    - assets/yemen_governorates_districts.json
    - assets/logo-internal-runtime.svg
    - assets/logo-external-runtime.svg
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
